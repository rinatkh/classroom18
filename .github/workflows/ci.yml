name: CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - run: make ci
  infrastructure:
    runs-on: ubuntu-latest
    env:
      TEST_REDIS_URL: redis://localhost:6379/0
      TEST_KAFKA_BROKERS: localhost:19092
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - name: Prepare isolated configuration
        run: |
          make env
          python3 - <<'PY'
          import os
          values = dict(line.split('=', 1) for line in open('.env').read().splitlines() if line and not line.startswith('#') and '=' in line)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('TEST_DATABASE_URL=postgres://postgres:' + values['POSTGRES_PASSWORD'] + '@localhost:5432/task_api?sslmode=disable\n')
          PY
      - run: make up
      - run: make integration test-db-race demo
      - if: always()
        run: docker compose --env-file .env -f deploy/compose.yaml logs --no-color
      - if: always()
        run: make down
